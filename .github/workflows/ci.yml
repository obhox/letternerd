name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token can read the repository and nothing else. A job that needs
# more says so itself, so a compromised step in `static` cannot push a package
# or open a pull request with credentials it happens to hold.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action below is pinned to a commit rather than a tag. A tag is a mutable
# pointer that the action's maintainer — or whoever takes over their account —
# can move to different code; a commit is not. Dependabot's github-actions
# ecosystem (.github/dependabot.yml) bumps the SHA and the trailing version
# comment together, so the comment stays honest.

jobs:
  # Fails fast with no services. Most breakage is caught here in under a minute.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm audit --audit-level=high
      # Fails a pull request that *adds* a dependency with a known high or
      # critical advisory, before `pnpm audit` has to find it installed. It
      # compares the two sides of the diff, so it only means anything on a PR.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # Non-blocking until the repository's Dependency graph is switched on
        # (Settings → Code security). Without it the action cannot run at all and
        # would fail every pull request for a reason unrelated to the change;
        # once the graph exists, drop this line so a vulnerable addition blocks.
        continue-on-error: true
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

  # A committed credential is the one class of leak a rebuild cannot undo.
  # Full history rather than the default shallow clone: the point is to catch
  # a secret added three commits ago and removed in the fourth, which a
  # depth-1 checkout would never see.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job summary already names the file and line. A PR comment
          # would need pull-requests: write, which nothing else here has a
          # use for. (GITLEAKS_LICENSE is only required for repositories
          # owned by an organisation; this one is owned by a user account.)
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Anything that needs a real database: migrations, tenant isolation, pagination.
  integration:
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cms:cms@localhost:5432/cms_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm -r --filter @cms/db test

  # Images are built here and never on the deploy target. A build competing
  # with the running app for RAM on a single-server host is how a deploy takes
  # the site down, and a locally-built image ties releases to one laptop.
  images:
    runs-on: ubuntu-latest
    # `secrets` is in the list so a leaked credential blocks the image that
    # would carry it to the registry.
    needs: [static, integration, secrets]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # Required for the default GITHUB_TOKEN to push to ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because ghcr.io rejects an uppercase path segment, and a
      # GitHub owner may legitimately contain capitals.
      - name: Resolve image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/letternerd" >> "$GITHUB_OUTPUT"

      - name: Studio image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.studio
          push: true
          # Both tags every time: `latest` is what a plain redeploy pulls, and
          # the SHA is the rollback handle — setting CMS_IMAGE_TAG to an older
          # one is a redeploy rather than a rebuild.
          tags: |
            ${{ steps.prefix.outputs.value }}-studio:latest
            ${{ steps.prefix.outputs.value }}-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and a max-detail provenance attestation ride alongside the
          # image as extra manifests in its index. Neither changes what runs;
          # both let a scanner or an auditor answer "what is in this image, and
          # which workflow run built it from which commit" without trusting
          # the tag.
          sbom: true
          provenance: mode=max

      - name: Migrate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.node
          build-args: APP=@cms/db
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}-db:latest
            ${{ steps.prefix.outputs.value }}-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  # Scans what was actually pushed rather than the build context, so an
  # advisory against a base-image package surfaces on the next push to main
  # even when nothing in this repository changed. Unfixed findings are
  # ignored: a rebuild cannot do anything about them, and a job that is
  # permanently red teaches everyone to stop reading it.
  #
  # This runs after the push, so a finding does not stop the image reaching
  # the registry — it stops the run going green, which is what anyone deciding
  # whether to redeploy looks at.
  image-scan:
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/letternerd" >> "$GITHUB_OUTPUT"

      - name: Scan studio image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.prefix.outputs.value }}-studio:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan migrate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.prefix.outputs.value }}-db:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
