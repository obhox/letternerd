# Deploy variant for images already present on the Coolify host's Docker daemon.
#
# The production file pulls from ghcr.io, which assumes a CI pipeline and a
# published repository. Neither exists yet — nothing has been pushed anywhere —
# so this variant runs the images built locally with:
#
#   docker build -f infra/docker/Dockerfile.studio -t letternerd-studio:0.1.0 .
#   docker build -f infra/docker/Dockerfile.node --build-arg APP=@cms/db -t letternerd-db:0.1.0 .
#
# It works because this Coolify server is `localhost` — it manages the same
# Docker daemon the images were built on. `pull_policy: never` is the load-
# bearing line: the default would try to reach a registry that has no such
# image and fail the deploy with a misleading "not found".
#
# Once images are published to a registry, use docker-compose.production.yml
# instead. Keeping the two separate rather than parameterising one is
# deliberate: the pull policies are opposite, and a single file that silently
# does the wrong one is worse than two that each say what they do.

services:
  migrate:
    image: letternerd-db:0.1.0
    pull_policy: never
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node_modules/.bin/tsx", "src/migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}

  studio:
    image: letternerd-studio:0.1.0
    pull_policy: never
    restart: unless-stopped
    # The container already runs as `cms` (the Dockerfile's USER); these close
    # the doors a non-root user could still walk through. no-new-privileges
    # stops a setuid binary from escalating; dropping every capability removes
    # what a web app never uses (it binds :3000, above the privileged range);
    # a read-only root filesystem means a code-execution bug cannot write a
    # persistent payload into the image's own files.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # The two places the app legitimately writes. /tmp is sharp's scratch space
    # during image processing; .next/cache is where Next keeps optimised images
    # and fetch results. Both are disposable, so tmpfs: gone on restart, never
    # on disk, and outside the read-only root.
    tmpfs:
      - /tmp
      - /repo/apps/studio/.next/cache
    # A ceiling so a runaway request or a leak degrades this service instead of
    # the whole host, which Postgres and the other projects share. Compose
    # honours deploy.resources.limits outside Swarm.
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    expose:
      - "3000"
    environment:
      SERVICE_FQDN_STUDIO_3000: /
      PORT: 3000
      NODE_ENV: production

      DATABASE_URL: ${DATABASE_URL}

      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      CMS_STUDIO_URL: ${SERVICE_URL_STUDIO}
      CMS_TRUSTED_ORIGINS: ${SERVICE_URL_STUDIO}
      CRON_SECRET: ${SERVICE_PASSWORD_CRON}

      MEDIA_STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      MEDIA_CDN_URL: ${MEDIA_CDN_URL}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-26214400}

      # Encrypts stored OAuth tokens and, now that webhook signing secrets sit
      # under the same cipher, every webhook's secret too. The studio boots
      # without it and refuses to create a webhook or connect Search Console
      # until it is set — there is no plaintext fallback. openssl rand -hex 32.
      ANALYTICS_ENCRYPTION_KEY: ${ANALYTICS_ENCRYPTION_KEY}

      # true | false. Whether anyone may create an account. Open by default;
      # set to false to admit only addresses that hold a live invitation.
      CMS_ALLOW_SIGNUP: ${CMS_ALLOW_SIGNUP:-true}
      # The header the rate limiters read the client address from. Traefik
      # overwrites X-Forwarded-For with the real peer; behind Cloudflare set
      # cf-connecting-ip, or every visitor shares one Cloudflare edge's budget.
      CMS_CLIENT_IP_HEADER: ${CMS_CLIENT_IP_HEADER:-x-forwarded-for}
      # Lowest site role that must enrol TOTP before the studio serves it. The
      # default here is the production default, spelled out because an empty
      # string is not "unset" to the enum that validates it.
      CMS_REQUIRE_2FA_ROLE: ${CMS_REQUIRE_2FA_ROLE:-owner}
      # `off` disables the studio's request budgets. Exists for end-to-end
      # suites; leave it unset here.
      CMS_RATE_LIMIT: ${CMS_RATE_LIMIT:-}

      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      NEXT_PUBLIC_CMS_STUDIO_URL: ${SERVICE_URL_STUDIO}
      NEXT_PUBLIC_MEDIA_CDN_URL: ${MEDIA_CDN_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
