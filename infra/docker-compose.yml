# Local development dependencies only.
#
# Production runs Postgres as a Coolify-managed database resource (so it
# inherits Coolify's scheduled backups) and media on Cloudflare R2 — see
# infra/docker-compose.production.yml and infra/DEPLOY.md.
#
# Ports are deliberately offset from the defaults so this stack can run
# alongside other local projects, and bound to loopback so they are reachable
# from this machine only: a laptop on café wifi would otherwise be serving a
# Postgres with the password `cms` and a MinIO console to the whole network.

name: cms-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Cloudflare R2. The same S3 client talks to both; the only
  # difference is forcePathStyle, which packages/media derives from S3_ENDPOINT.
  # Dated release tags with digests rather than `latest`. MinIO stopped
  # publishing new Docker Hub images after these releases, so `latest` is a
  # frozen pointer anyway; pinning it just says so, and lets Dependabot's
  # docker ecosystem notice if that ever changes.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: cmsminio
      MINIO_ROOT_PASSWORD: cmsminio123
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9101"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and make it publicly readable, because media
  # URLs are served straight to browsers and crawlers.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cmsminio cmsminio123 &&
      mc mb --ignore-existing local/cms-media &&
      mc anonymous set download local/cms-media
      "
